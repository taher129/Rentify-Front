<div class="main-container">
  <app-sidebar
    [conversations]="conversations"
    [contacts]="contacts"
    (startConversation)="startNewConversation($event)"
    (openChat)="openMainChat($event)">
  </app-sidebar>

  <app-chat-area class="chat-area"
                 [conversation]="currentConversation"
                 [currentOtherUserName]="currentOtherUserName">
  </app-chat-area>
</div>
