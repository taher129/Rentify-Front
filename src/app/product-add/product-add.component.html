<!-- src/app/components/product-add/product-add.component.html -->
<div class="container">
  <h2>Add New Product</h2>
  <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
    <!-- Name -->
    <div class="form-group">
      <label for="name">Product Name</label>
      <input
        id="name"
        type="text"
        formControlName="name"
        class="form-control"
        [class.is-invalid]="productForm.get('name')?.touched && productForm.get('name')?.invalid"
      />
      <div *ngIf="productForm.get('name')?.touched && productForm.get('name')?.invalid" class="invalid-feedback">
        <div *ngIf="productForm.get('name')?.errors?.['required']">Name is required.</div>
        <div *ngIf="productForm.get('name')?.errors?.['minlength']">Name must be at least 3 characters long.</div>
      </div>
    </div>

    <!-- Price -->
    <div class="form-group">
      <label for="price">Price</label>
      <input
        id="price"
        type="number"
        formControlName="price"
        class="form-control"
        [class.is-invalid]="productForm.get('price')?.touched && productForm.get('price')?.invalid"
      />
      <div *ngIf="productForm.get('price')?.touched && productForm.get('price')?.invalid" class="invalid-feedback">
        <div *ngIf="productForm.get('price')?.errors?.['required']">Price is required.</div>
        <div *ngIf="productForm.get('price')?.errors?.['min']">Price cannot be negative.</div>
      </div>
    </div>

    <!-- Description -->
    <div class="form-group">
      <label for="description">Description</label>
      <textarea
        id="description"
        formControlName="description"
        class="form-control"
        [class.is-invalid]="productForm.get('description')?.touched && productForm.get('description')?.invalid"
      ></textarea>
      <div *ngIf="productForm.get('description')?.touched && productForm.get('description')?.invalid" class="invalid-feedback">
        <div *ngIf="productForm.get('description')?.errors?.['required']">Description is required.</div>
        <div *ngIf="productForm.get('description')?.errors?.['minlength']">Description must be at least 10 characters long.</div>
      </div>
    </div>

    <!-- Category -->
    <div class="form-group">
      <label for="categoryId">Category</label>
      <select
        id="categoryId"
        formControlName="categoryId"
        class="form-control"
        [class.is-invalid]="productForm.get('categoryId')?.touched && productForm.get('categoryId')?.invalid"
      >
        <option value="">Select a category</option>
        <option *ngFor="let category of categories" [value]="category.id_Category">
          {{ category.category_Name }}
        </option>
      </select>
      <div *ngIf="productForm.get('categoryId')?.touched && productForm.get('categoryId')?.invalid" class="invalid-feedback">
        Category is required.
      </div>
    </div>

    <!-- Image -->
    <div class="form-group">
      <label for="productImage">Product Image</label>
      <input
        id="productImage"
        type="file"
        (change)="onImageSelected($event)"
        class="form-control"
        accept="image/*"
      />
      <img *ngIf="imagePreview" [src]="imagePreview" alt="Image Preview" class="image-preview" />
    </div>

    <!-- Submit Button -->
    <button type="submit" class="btn btn-primary" [disabled]="productForm.invalid">Add Product</button>
  </form>
</div>
