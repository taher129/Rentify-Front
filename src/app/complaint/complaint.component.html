  <div class="flex flex-col md:flex-row gap-6 animate-fadeIn">
    <!-- Conteneur des deux filtres -->
    <div class="w-full md:w-1/2 space-y-4"> <!-- Added space-y-4 for vertical spacing -->
      <!-- Filtrer par statut -->
      <div class="mb-4"> <!-- Added margin-bottom -->
        <label for="statusFilter" class="block mb-1 text-sm font-semibold text-gray-800">
          🎯 Filtrer par statut
        </label>
        <select id="statusFilter" [(ngModel)]="selectedStatus" (change)="filterComplaints()"
          class="w-full px-4 py-2 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 transition-all duration-300"
        >
          <option value="">-- Tous --</option>
          <option *ngFor="let status of statusList" [value]="status">{{ status }}</option>
        </select>
  
      <!-- Filtrer par type -->
        <label for="type" class="block mb-1 text-sm font-semibold text-gray-800">
                    🗂️ Filtrer par type
        </label>
        <select [(ngModel)]="selectedType" (change)="filterComplaints()"
          class="w-full px-4 py-2 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 transition-all duration-300"
        >
          <option value="">-- Tous --</option>
          <option *ngFor="let type of typeList" [value]="type">{{ type }}</option>
        </select>
      </div>
    </div>
  </div>
  
   

  <h2 class="text-2xl font-semibold mb-4 text-gray-800 text-center"> 📋 Complaints List</h2>

  <table class="min-w-full border border-gray-200 rounded-lg overflow-hidden">
    <thead class="bg-gray-100 text-gray-700 text-left text-sm uppercase">
      <tr>
       <th class="px-5 py-3">ID</th>
        <th class="px-5 py-3">User</th>
        <th class="px-5 py-3">Reported</th>
        <th class="px-5 py-3">Description</th>
        <th class="px-5 py-3">Type</th>
        <th class="px-5 py-3">Evidence</th>
        <th class="px-5 py-3">Status</th>
        <th class="px-5 py-3">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let complaint of complaints" class="hover:bg-gray-50 transition-colors">
        <td class="px-4 py-2">{{ complaint.complaintId }}</td>
        <td class="px-4 py-2">{{ complaint.userId }}</td>
        <td class="px-4 py-2">{{ complaint.reportedUserId }}</td>
        <td class="px-4 py-2">{{ complaint.description }}</td>
        <td class="px-4 py-2">{{ complaint.complaintType }}</td>
        <td class="px-4 py-2">{{ complaint.evidence }}</td>
        <td class="px-4 py-2">
          <span [ngClass]="{
              'text-green-600 font-medium': complaint.status === 'RESOLVED',
              'text-yellow-600 font-medium': complaint.status === 'PENDING',
              'text-red-600 font-medium': complaint.status === 'REJECTED'
            }">{{ complaint.status }}</span>
        </td>
        <!-- <td class="px-4 py-2 flex flex-col gap-2 sm:flex-row">
          <button class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded-md text-sm"
          [routerLink]="['/complaint/update', complaint.complaintId]">
    ✏️ Modifier
  </button>
  <button class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-md text-sm"
          (click)="deleteComplaint(complaint.complaintId!)">
    🗑️ Supprimer
  </button>
  <button class="bg-gray-500 hover:bg-gray-600 text-white px-3 py-1 rounded-md text-sm"
          [routerLink]="['/complaint/detail', complaint.complaintId]">
    🔍 Détail
  </button>
  <button *ngIf="complaint.complaintId"
  class="bg-purple-500 hover:bg-purple-600 text-white px-3 py-1 rounded-md text-sm"
  (click)="downloadPdf(complaint.complaintId)">
  📄 Télécharger PDF
</button>

        </td> -->
        <td class="px-4 py-2">
          <div class="flex items-center gap-x-4 text-lg">
            <!-- Modifier -->
            <a [routerLink]="['/complaint/update', complaint.complaintId]"
               class="text-gray-700 hover:text-blue-600 transition-transform transform hover:scale-110"
               title="Modifier">
              ✏️
            </a>
        
            <!-- Supprimer -->
            <button (click)="deleteComplaint(complaint.complaintId!)"
                    class="text-gray-700 hover:text-red-600 transition-transform transform hover:scale-110"
                    title="Supprimer">
              🗑️
            </button>
        
            <!-- Détail -->
            <a [routerLink]="['/complaint/detail', complaint.complaintId]"
               class="text-gray-700 hover:text-gray-900 transition-transform transform hover:scale-110"
               title="Détail">
              🔍
            </a>
        
            <!-- Télécharger PDF -->
            <button *ngIf="complaint.complaintId"
                    (click)="downloadPdf(complaint.complaintId)"
                    class="text-gray-700 hover:text-purple-600 transition-transform transform hover:scale-110"
                    title="Télécharger PDF">
              📄
            </button>
          </div>
        </td>
        
        
      </tr>
    </tbody>
  </table>
</div>
