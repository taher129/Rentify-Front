<div class="image-to-text-container">
    <h2>🖼️ Extraction de Texte à partir d'une Image</h2>
  
    <div class="form-container">
      <div class="form-group">
        <label for="imageUrl">URL de l'image :</label>
        <input type="text" id="imageUrl" [(ngModel)]="imageUrl" placeholder="https://exemple.com/image.jpg" />
      </div>
  
      <div class="button-group">
        <button class="primary-button" (click)="extractTextFromImage()" [disabled]="isLoading">
          <span *ngIf="!isLoading">Extraire le texte</span>
          <span *ngIf="isLoading">Traitement en cours...</span>
        </button>
        <button class="secondary-button" (click)="clearAll()">Effacer</button>
      </div>
    </div>
  
    <div *ngIf="errorMessage" class="error-message">
      ⚠️ {{ errorMessage }}
    </div>
  
    <div *ngIf="isSuccess" class="result-container">
      <div class="image-preview">
        <h3>🖼️ Image source :</h3>
        <img [src]="imageUrl" alt="Image source" *ngIf="imageUrl" />
      </div>
  
      <div class="text-result">
        <h3>📝 Texte extrait :</h3>
        <div class="text-content">{{ extractedText }}</div>
      </div>
    </div>
  </div>
