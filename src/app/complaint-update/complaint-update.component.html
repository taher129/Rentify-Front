<div class="complaint-container" *ngIf="!isSubmitted">
    <form (ngSubmit)="update()" #complaintForm="ngForm" class="complaint-card animate">
      <h2>✏️ Update Complaint</h2>
  
      <div *ngIf="errorMessage" class="error-text">{{ errorMessage }}</div>
  
      <div class="form-group">
        <label for="complaintType">Complaint Type</label>
        <select id="complaintType" name="complaintType" [(ngModel)]="complaintDTO.complaintType" required class="form-control">
          <option value="">-- Select Type --</option>
          <option *ngFor="let type of complaintTypes" [value]="type">{{ type }}</option>
        </select>
      </div>
  
      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" [(ngModel)]="complaintDTO.description" required class="form-control" placeholder="Describe the issue..."></textarea>
      </div>
  
      <div class="form-group">
        <label for="evidence">Evidence (URLs, optional)</label>
        <input type="text" id="evidence" name="evidenceInput" [(ngModel)]="evidenceInput" class="form-control" placeholder="e.g., http://example.com/image.jpg">
      </div>
  
      <button type="submit" class="btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'Updating...' : 'Update Complaint' }}
        <span *ngIf="isLoading" class="loading-spinner"></span>
      </button>
    </form>
  </div>
  
  <!-- <div class="complaint-card submitted animate" *ngIf="isSubmitted">
    <div class="checkmark success-animation">&#10003;</div>
    <h2>Complaint Updated!</h2>
    <p>Your complaint has been successfully updated.</p>
    <button class="btn-success" (click)="goToComplaintList()">🔙 Back to Complaints</button>
  </div>
   -->
   <div class="update-confirmation" *ngIf="isSubmitted">
    <div class="confirmation-card">
      <div class="animated-check">
        <svg viewBox="0 0 24 24">
          <path class="check-path" fill="none" d="M4.1 12.7L9 17.6 20.3 6.3"/>
        </svg>
      </div>
      <h2 class="confirmation-title">Update Successful!</h2>
      <p class="confirmation-text">Your complaint details have been successfully updated in our system.</p>
      <button class="action-btn" (click)="goToComplaintList()">
        <span>Return to List</span>
        <svg class="back-arrow" viewBox="0 0 24 24">
          <path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
        </svg>
      </button>
    </div>
  </div>
  
  <style>
  :host {
    --primary-accent: #4a90e2;
    --success-green: #34C759;
    --text-dark: #1a1a1a;
    --text-light: #666;
    --transition-speed: 0.4s;
  }
  
  .update-confirmation {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #f5f7fa 0%, #e6e9ef 100%);
    padding: 2rem;
  }
  
  .confirmation-card {
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(8px);
    border-radius: 20px;
    padding: 3rem;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    max-width: 440px;
    width: 90%;
    text-align: center;
    transform-origin: center;
    animation: cardAppear 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.1);
  }
  
  .animated-check {
    width: 80px;
    height: 80px;
    margin: 0 auto 1.5rem;
    position: relative;
  }
  
  .animated-check svg {
    width: 100%;
    height: 100%;
  }
  
  .check-path {
    stroke: var(--success-green);
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-dasharray: 50;
    stroke-dashoffset: 50;
    animation: drawCheck var(--transition-speed) ease-out forwards;
  }
  
  .confirmation-title {
    color: var(--text-dark);
    font-size: 1.8rem;
    margin-bottom: 1rem;
    font-weight: 700;
    letter-spacing: -0.03em;
  }
  
  .confirmation-text {
    color: var(--text-light);
    font-size: 1.05rem;
    line-height: 1.6;
    margin-bottom: 2rem;
    opacity: 0.9;
  }
  
  .action-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.9rem 2rem;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary-accent) 0%, #2673C8 100%);
    color: white;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: all var(--transition-speed) cubic-bezier(0.23, 1, 0.32, 1);
    box-shadow: 0 4px 6px rgba(74, 144, 226, 0.2);
  }
  
  .action-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(74, 144, 226, 0.25);
    gap: 1rem;
  }
  
  .action-btn:active {
    transform: translateY(1px);
  }
  
  .back-arrow {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform var(--transition-speed) ease;
  }
  
  .action-btn:hover .back-arrow {
    transform: translateX(-3px);
  }
  
  @keyframes cardAppear {
    0% {
      opacity: 0;
      transform: scale(0.95) translateY(15px);
    }
    100% {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }
  
  @keyframes drawCheck {
    to {
      stroke-dashoffset: 0;
    }
  }
  
  @media (max-width: 480px) {
    .confirmation-card {
      padding: 2rem 1.5rem;
      border-radius: 18px;
    }
    
    .confirmation-title {
      font-size: 1.5rem;
    }
    
    .action-btn {
      padding: 0.8rem 1.5rem;
      font-size: 0.95rem;
    }
  }
  </style>
