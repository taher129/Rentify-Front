<div class="auth-container">
  <!-- Left side - Carousel -->
  <div class="carousel-container">
    <app-carousel></app-carousel>
  </div>

  <!-- Right side - Form -->
  <div class="form-container">
    <div class="form-content">
      <div class="brand">
        <div class="logo-container">
          <div class="logo">R</div>
        </div>
        <span>Rentify</span>
      </div>

      <div class="form-header">
        <h1>New Password</h1>
        <p>Step 3 of 3</p>
        <p class="subtitle">Create a new password for your account</p>
      </div>

      <div class="form-scroll-container">
        <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="auth-form">
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input
              id="newPassword"
              type="password"
              formControlName="newPassword"
              placeholder="Enter new password"
              class="form-input"
              [class.focused]="focusedField === 'newPassword'"
              (focus)="onFocus('newPassword')"
              (blur)="onBlur()">

            <div class="password-strength" *ngIf="resetForm.get('newPassword')?.value">
              <div class="strength-meter">
                <span class="strength-segment" [class.active]="passwordStrength >= 1"></span>
                <span class="strength-segment" [class.active]="passwordStrength >= 2"></span>
                <span class="strength-segment" [class.active]="passwordStrength >= 3"></span>
                <span class="strength-segment" [class.active]="passwordStrength >= 4"></span>
              </div>
              <span class="strength-text">{{getPasswordStrengthText()}}</span>
            </div>

            <div *ngIf="resetForm.get('newPassword')?.hasError('required') && resetForm.get('newPassword')?.touched"
                 class="error-message">
              Password is required
            </div>
            <div *ngIf="resetForm.get('newPassword')?.hasError('minlength')"
                 class="error-message">
              Password must be at least 8 characters
            </div>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
              id="confirmPassword"
              type="password"
              formControlName="confirmPassword"
              placeholder="Confirm new password"
              class="form-input"
              [class.focused]="focusedField === 'confirmPassword'"
              (focus)="onFocus('confirmPassword')"
              (blur)="onBlur()">
            <div *ngIf="resetForm.get('confirmPassword')?.hasError('required') && resetForm.get('confirmPassword')?.touched"
                 class="error-message">
              Please confirm your password
            </div>
            <div *ngIf="resetForm.hasError('mismatch') && resetForm.get('confirmPassword')?.touched"
                 class="error-message">
              Passwords do not match
            </div>
          </div>

          <button type="submit" class="submit-btn" [disabled]="resetForm.invalid">
            Reset Password
          </button>

          <div class="back-link">
            <a routerLink="/verify-otp" [state]="{ phoneNumber: phoneNumber }">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
              </svg>
              Back to verification
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
