<div class="auth-container">
  <!-- Left side - Carousel -->
  <div class="carousel-container">
    <app-carousel></app-carousel>
  </div>

  <!-- Right side - Form -->
  <div class="form-container">
    <div class="form-content">
      <div class="brand">
        <div class="logo-container">
          <div class="logo">R</div>
        </div>
        <span>Rentify</span>
      </div>

      <div class="form-header">
        <h1>Reset Password</h1>
        <p>Step 1 of 3</p>
        <p class="subtitle">Enter your phone number to receive a verification code</p>
      </div>

      <div class="form-scroll-container">
        <form [formGroup]="phoneForm" (ngSubmit)="onSubmit()" class="auth-form">
          <div class="form-group">
            <label for="phoneNumber">Phone Number</label>
            <input
              id="phoneNumber"
              type="tel"
              formControlName="phoneNumber"
              placeholder="Enter your phone number"
              class="form-input"
              [class.focused]="focusedField === 'phoneNumber'"
              (focus)="onFocus('phoneNumber')"
              (blur)="onBlur()">
            <div *ngIf="phoneForm.get('phoneNumber')?.errors?.['required'] && phoneForm.get('phoneNumber')?.touched"
                 class="error-message">
              Phone number is required
            </div>
            <div *ngIf="phoneForm.get('phoneNumber')?.errors?.['pattern'] && phoneForm.get('phoneNumber')?.touched"
                 class="error-message">
              Phone number must be 8 digits
            </div>
          </div>

          <button type="submit" class="submit-btn" [disabled]="phoneForm.invalid">
            Send OTP
          </button>

          <div class="back-to-login">
            <p>Remember your password? <a routerLink="/login">Login</a></p>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
