<h2 mat-dialog-title>Register Your Face ID</h2>

<mat-dialog-content>
  <div class="face-capture-container">
    <video #videoElement autoplay playsinline></video>

    <div *ngIf="isCapturing" class="capture-guidance">
      <p>{{ captureMessages[currentCapture] }}</p>
      <mat-progress-bar mode="determinate" [value]="captureProgress"></mat-progress-bar>
      <p>Capture {{ currentCapture + 1 }} of {{ captureMessages.length }}</p>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelCapture()">Cancel</button>
  <button *ngIf="!isCapturing && capturedImages.length === 0"
          mat-raised-button
          color="primary"
          (click)="captureFaceImages()">
    Start Capture
  </button>
  <button *ngIf="!isCapturing && capturedImages.length > 0"
          mat-raised-button
          color="primary"
          (click)="completeCapture()">
    Complete
  </button>
</mat-dialog-actions>
