<div class="login-container">
  <!-- Left side - Login form -->
  <div class="login-form-container">
    <div class="login-form-content">
      <div class="login-header">
        <h1>Welcome back!</h1>
        <p>Enter your credentials to access your account</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="login-form">
          <!-- Email Field -->
          <div class="form-group">
            <label for="email">Email address</label>
            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              formControlName="email"
              (blur)="markEmailAsTouched()"
              [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
            />

          </div>


          <!-- Password Field -->
          <div class="form-group">
            <div class="password-header">
              <label for="password">Password</label>
            </div>
            <input
              id="password"
              formControlName="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Enter your password"
              [ngClass]="{
                'input-error':
                  loginForm.get('password')?.touched && loginForm.get('password')?.invalid
              }"
              (blur)="markPasswordAsTouched()"
            />

          </div>

          <!-- Remember Me and Forgot Password -->
          <div class="remember-me">
            <div>
              <input type="checkbox" id="remember" name="remember" />
            </div>
            <div>
              <label for="remember">Remember me</label>
              <a href="#" class="forgot-password">Forgot password</a>
            </div>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            [disabled]="loginForm.invalid || isLoading"
            class="login-button"
          >
            <span *ngIf="!isLoading">Login</span>
            <span *ngIf="isLoading" class="spinner"></span>
          </button>
          <div *ngIf="errorMessage" class="error-message-minimalist">
            <span class="error-icon-minimalist">⚠️</span>
            <p>{{ errorMessage }}</p>
          </div>

          <button class="login-button"  type="button" (click)="openFaceLogin()">🔓 Login with Face ID</button>



          <!-- Divider -->
          <div class="divider">
            <span>Or</span>
          </div>

          <!-- Social Login Buttons -->
          <div class="social-login">
            <!-- Google -->
            <button class="social-button google-button" (click)="loginWithGoogle()">
              <svg
                width="18"
                height="18"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
              >
                <path
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                  fill="#4285F4"
                />
                <path
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  fill="#34A853"
                />
                <path
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                  fill="#FBBC05"
                />
                <path
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                  fill="#EA4335"
                />
                <path d="M1 1h22v22H1z" fill="none" />
              </svg>
              <span>Sign in with Google</span>
            </button>

            <!-- Apple -->
            <button class="social-button apple-button">
              <svg
                width="18"
                height="18"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 384 512"
              >
                <path
                  d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"
                  fill="#000"
                />
              </svg>
              <span>Sign in with Apple</span>
            </button>
          </div>

          <!-- Sign Up Link -->
          <div class="signup-link">
            <span>Don't have an account?</span>
            <a href="/signup">Sign Up</a>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Right side - Plant image -->
  <div class="image-container">
    <!-- You can add an image here -->
    <!-- Example: <img src="assets/plant.png" alt="Eco Plant" /> -->
  </div>
</div>
