<div class="face-auth">
  <h2>{{ isLoginMode ? 'Login with Face ID' : 'Register Face ID' }}</h2>

  <button (click)="toggleMode()">Switch to {{ isLoginMode ? 'Register' : 'Login' }}</button>
  <button (click)="startCamera()" *ngIf="!isCameraActive">📷 Start Camera</button>

  <div *ngIf="isCameraActive">
    <video #videoElement autoplay></video>
    <canvas #canvas style="display: none;"></canvas>

    <button [disabled]="isProcessing" (click)="captureAndSendFace()">🟢 Capture & Submit</button>
    <button (click)="stopCamera()">❌ Stop Camera</button>
  </div>
</div>
