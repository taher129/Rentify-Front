<div class="blog-container">
    <h1 class="blog-title">Latest Blog Posts</h1>
    <div class="blog-grid">
      <div *ngFor="let post of blogPosts" class="blog-card">
        <img [src]="post.images[0]" alt="{{ post.title }}" class="blog-image">
        <div class="blog-content">
          <h2>{{ post.title }}</h2>
          <p>{{ post.excerpt }}</p>
          <a [routerLink]="['/blog', post.id]" class="read-more">Read More</a>
        </div>
      </div>
    </div>
  </div>
